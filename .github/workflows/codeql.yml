name: Bench CodeQL

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Bench author eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Decide author eligibility
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              case "$AUTHOR_ASSOCIATION" in OWNER|MEMBER) exit 0 ;; esac
              test "$ACTOR" = 'dependabot[bot]'
              test "$PR_AUTHOR_LOGIN" = 'dependabot[bot]'
              test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
              ;;
            *) exit 1 ;;
          esac

  analyze:
    name: Bench CodeQL JavaScript-TypeScript
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
