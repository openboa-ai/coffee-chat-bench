name: Bench policy

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  policy:
    name: Bench policy contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref:
            ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify governance and migration policy
        env:
          MIGRATION_TARGET_SHA:
            ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha || github.sha }}
        run: npm run ci:policy

  dependency-review:
    name: Bench dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Review pull request dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: never
      - name: Review merge group dependencies
        if: github.event_name == 'merge_group'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}
          comment-summary-in-pr: never
