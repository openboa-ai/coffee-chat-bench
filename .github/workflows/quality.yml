name: Bench quality

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  quality:
    name: Bench deterministic quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              printf '%s\n' 'author=untrusted' >&2
              exit 1
              ;;
          esac
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref:
            ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha || github.sha }}
      - name: Install immutable Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Scan complete Git history
        run: |
          test ! -e .gitleaks.toml
          test ! -e .gitleaksignore
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify inactive boundary
        run: node scripts/check-inactive-boundary.mjs --root .
      - name: Run deterministic tests
        run: node --test tests/*.test.mjs

  aggregate:
    name: Bench required
    if: always()
    needs:
      - quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          case "$QUALITY_RESULT" in
            success)
              printf '%s\n' 'quality=succeeded'
              ;;
            failure)
              printf '%s\n' 'quality=failed' >&2
              exit 1
              ;;
            skipped)
              printf '%s\n' 'quality=skipped' >&2
              exit 1
              ;;
            cancelled)
              printf '%s\n' 'quality=unavailable' >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'quality=invalid' >&2
              exit 1
              ;;
          esac
