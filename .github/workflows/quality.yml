name: Bench quality

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  quality:
    name: Bench deterministic quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              if [ "$AUTHOR_LOGIN" = 'openboa' ]; then
                printf '%s\n' 'author=trusted_login'
              else
                printf '%s\n' 'author=untrusted' >&2
                exit 1
              fi
              ;;
          esac
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref:
            ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Verify inactive boundary
        run: npm run inactive:check
      - name: Run deterministic tests
        run: npm test
      - name: Verify governance and migration policy
        env:
          MIGRATION_TARGET_SHA:
            ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha || github.sha }}
        run: npm run ci:policy

  aggregate:
    name: Bench required
    if: always()
    needs:
      - quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          case "$QUALITY_RESULT" in
            success)
              printf '%s\n' 'quality=succeeded'
              ;;
            failure)
              printf '%s\n' 'quality=failed' >&2
              exit 1
              ;;
            skipped)
              printf '%s\n' 'quality=skipped' >&2
              exit 1
              ;;
            cancelled)
              printf '%s\n' 'quality=unavailable' >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'quality=invalid' >&2
              exit 1
              ;;
          esac
